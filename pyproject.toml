[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "future-wildlife-traffic-ai"
version = "0.2.0"
description = "Configurable wildlife advisory and traffic simulation pilot"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1", "PyYAML>=6,<7", "tzdata>=2024.1"]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.9,<5", "numpy>=1.26,<3", "ultralytics>=8.2,<9"]
mqtt = ["paho-mqtt>=2.1,<3"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
wildlife-traffic = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
