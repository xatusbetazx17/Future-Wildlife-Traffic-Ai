services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      WILDLIFE_API_KEY: ${WILDLIFE_API_KEY:?Set a random read token of at least 32 characters}
      WILDLIFE_ADMIN_KEY: ${WILDLIFE_ADMIN_KEY:-}
      WILDLIFE_SENSOR_KEYS: ${WILDLIFE_SENSOR_KEYS:-}
    volumes:
      - wildlife-data:/app/var
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
volumes:
  wildlife-data:
